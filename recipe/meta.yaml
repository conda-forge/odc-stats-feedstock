{% set name = "odc-stats" %}
{% set version = "1.9.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 40328332f30f72a45410b315b8474652cc80c7fb779101813e8492fe0557c6e8

build:
  entry_points:
    - odc-stats = odc.stats.cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=51.0.0
    - wheel
    - setuptools-scm >=6.2
    - pip
  run:
    - python >={{ python_min }}
    - aiobotocore
    - botocore
    - click >=8.0.0
    - dask-core
    - datacube ==1.9.5
    - distributed >=2025.4,<2025.9
    - numpy
    - odc-cloud
    - odc-algo >=1.0.1,<1.1
    - odc-dscache >=1.9.0
    - odc-io
    - odc-stac
    - pandas
    - pystac >=1.1.0
    - eodatasets3 >=1.9.0
    - toolz
    - tqdm
    - xarray >=2023.1.0
    - ciso8601
    - gdal
    - fsspec >=2022.1.0
    - fiona
    - rasterio >=1.3.2
    - s3fs
    - ai-edge-litert
    - tl2cgen

test:
  imports:
    - odc
  commands:
    - pip check
    - odc-stats --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/opendatacube/odc-stats/
  summary: Statistical Product Generation Framework
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - andrewdhicks
    - SpacemanPaul
    - Ariana-B
